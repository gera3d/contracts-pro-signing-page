<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contracts Pro Signing</title>
  </head>
  <body>
    <script>
      const parts = window.location.pathname.split("/").filter(Boolean);
      const signIndex = parts.indexOf("sign");
      if (signIndex !== -1 && parts[signIndex + 1]) {
        const baseParts = parts.slice(0, signIndex);
        const basePath = baseParts.length ? `/${baseParts.join("/")}/` : "/";
        const token = parts[signIndex + 1];
        window.location.replace(
          `${window.location.origin}${basePath}#/sign/${encodeURIComponent(token)}`
        );
      } else {
        const basePath = parts[0] === "contracts-pro-signing-page"
          ? "/contracts-pro-signing-page/"
          : "/";
        window.location.replace(`${window.location.origin}${basePath}`);
      }
    </script>
  </body>
</html>
